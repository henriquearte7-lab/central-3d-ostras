<style>
/* Layout: barra fixa com abas; cada aba é uma bancada de trabalho; a proposta é uma folha A4 que mantém a marca em qualquer tema */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
  --navy:#16304d; --navy-deep:#0c1e33; --orange:#f07a1a; --orange-deep:#c95a0c;
  --bg:#edf1f5; --surface:#ffffff; --fg:#17222e; --mute:#5b6a7a; --line:#d5dde6; --hover:#f1f4f8; --field:#ffffff;
  --accent:#d9650c; --accent-fg:#ffffff; --head:#16304d;
  --good:#1d7f52; --good-bg:#e3f4ea; --warn:#9a6a00; --warn-bg:#fdf1d6; --bad:#b4372a; --bad-bg:#fbe6e3; --info:#2c5d8f; --info-bg:#e4eef8;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151d; --surface:#16202b; --fg:#e4eaf0; --mute:#97a6b5; --line:#2a3644; --hover:#1d2935; --field:#101922;
  --accent:#f5893a; --accent-fg:#1a0d02; --head:#cfe0f2;
  --good:#5fd39a; --good-bg:#12301f; --warn:#f2c35b; --warn-bg:#33280c; --bad:#ff8a7c; --bad-bg:#3a1714; --info:#8fbef0; --info-bg:#152b42;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151d; --surface:#16202b; --fg:#e4eaf0; --mute:#97a6b5; --line:#2a3644; --hover:#1d2935; --field:#101922;
  --accent:#f5893a; --accent-fg:#1a0d02; --head:#cfe0f2;
  --good:#5fd39a; --good-bg:#12301f; --warn:#f2c35b; --warn-bg:#33280c; --bad:#ff8a7c; --bad-bg:#3a1714; --info:#8fbef0; --info-bg:#152b42;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-deep)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--navy-deep);color:#fff}
.top-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brandrow{display:flex;align-items:center;gap:10px}
.brandrow img{width:44px;height:34px;object-fit:contain}
.brandrow b{font:800 21px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.brandrow span{color:#9fb3c8;font-size:13px}
.sync{margin-left:auto;font-size:12.5px;color:#9fb3c8;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#7c8a99}
.sync.on i{background:#4fd18b}.sync.off i{background:#f0b44c}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:#b8c7d6;text-decoration:none;font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px 11px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:#fff}
nav.tabs a.on{color:#fff;border-bottom-color:var(--orange)}

main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:16px}
.vhead h1{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;color:var(--head);text-wrap:balance}
.vhead p{margin:0;color:var(--mute);font-size:14px;max-width:62ch;flex-basis:100%}
.vhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-weight:600;font-size:14px}

.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.sec{margin-top:26px}
.sec>h2{font:700 15px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec>h2::before{content:"";width:9px;height:9px;background:var(--orange);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .l{font:700 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font:800 27px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .h{font-size:12.5px;color:var(--mute);line-height:1.35}
.kpi.hl{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.bar{height:7px;border-radius:4px;background:var(--hover);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.good i{background:var(--good)}.bar.warn i{background:#d79a12}.bar.bad i{background:var(--bad)}

/* Tabelas */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.t th{text-align:left;font:700 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}.t .c{text-align:center}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--hover)}
.t td small{display:block;color:var(--mute);font-size:12.5px}
.t tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.empty{color:var(--mute);padding:22px 16px;text-align:center;line-height:1.55}
.chip{display:inline-block;font:600 12px var(--f-body);padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--hover);color:var(--mute)}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Formulários */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font:600 13px var(--f-body);color:var(--mute)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--field);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:12px;color:var(--mute);line-height:1.35}
.f .suf{display:flex;align-items:center;gap:6px}.f .suf span{color:var(--mute);font-size:13px;white-space:nowrap}
fieldset{border:0;padding:0;margin:0 0 18px}
fieldset legend{font:700 14px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--head);margin-bottom:10px;padding:0}

/* Calculadora */
.calc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.calc{grid-template-columns:1fr}}
.res{position:sticky;top:110px;display:flex;flex-direction:column;gap:12px}
.lines{display:flex;flex-direction:column}
.lines div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.lines div span:first-child{color:var(--mute)}
.lines div.tot{border-bottom:0;font-weight:700;padding-top:9px}
.price{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.price .kpi .v{font-size:30px}
.pkg{display:flex;flex-direction:column;gap:6px}
.pkg .row{display:grid;grid-template-columns:minmax(0,1fr) 70px 90px 32px;gap:6px}
.pkg input{border:1px solid var(--line);background:var(--field);border-radius:7px;padding:7px 8px;min-width:0;width:100%}
details.params summary{cursor:pointer;font-weight:600;color:var(--mute);font-size:14px}
details.params[open] summary{margin-bottom:10px}

/* Modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(6,14,24,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);border-radius:12px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font:800 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em;flex:1}
.mbody{padding:18px}
.mfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mfoot .sp{flex:1}
.items-ed{display:flex;flex-direction:column;gap:8px}
.items-ed .it{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) 70px 95px 95px 32px;gap:6px;align-items:end}
.items-ed .it .f label{font-size:11.5px}
@media (max-width:640px){.items-ed .it{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:8px}.items-ed .it .x{justify-self:end}}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{display:flex;justify-content:space-between;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.pick button:hover{background:var(--hover);border-color:var(--accent)}
.pick small{color:var(--mute);display:block}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}

/* Propostas */
.pwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.pwrap>div{min-width:0}
@media (max-width:980px){.pwrap{grid-template-columns:1fr}}
.plist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.plist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.plist button:hover{background:var(--hover)}
.plist button.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.plist b{font:700 16px var(--f-display);font-variant-numeric:tabular-nums}
.plist small{color:var(--mute);grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .tv{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
@media (max-width:980px){.plist{flex-direction:row;overflow-x:auto;max-height:none}.plist button{min-width:200px}}
.ptools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.scroller{max-width:100%;overflow:hidden}

/* Folha A4 — cores fixas da marca */
.sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#18222e;position:relative;box-shadow:0 1px 3px rgba(12,30,51,.12),0 12px 40px rgba(12,30,51,.16);display:flex;flex-direction:column;overflow:hidden;font:12.5px/1.45 var(--f-body);transform-origin:top left}
.sheet .wm{position:absolute;left:50%;top:56%;width:62%;transform:translate(-50%,-50%);opacity:.055;pointer-events:none;z-index:0}
.sheet>*:not(.wm){position:relative;z-index:1}
.sheet [contenteditable]{border-radius:2px}
.sheet [contenteditable]:hover{background:rgba(240,122,26,.09)}
.sheet [contenteditable]:empty::before{content:attr(data-ph);color:#9aa6b2}
.hd{background:#16304d;color:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 26px}
.hd img{width:118px;height:92px;object-fit:contain}
.hd h2{font:800 26px/1 var(--f-display);letter-spacing:.04em;margin:0;text-transform:uppercase}
.hd .tag{color:#f07a1a;font:700 12px var(--f-display);letter-spacing:.22em;text-transform:uppercase;margin-top:5px}
.hd .dt{margin-top:8px;font-size:11px;line-height:1.55;color:#c9d5e2;white-space:pre-line}
.hd .doc{text-align:right}
.hd .doc .t{font:700 12px var(--f-display);letter-spacing:.2em;color:#c9d5e2;text-transform:uppercase}
.hd .doc .n{font:800 30px/1.05 var(--f-display);color:#fff;font-variant-numeric:tabular-nums}
.hd .doc .d{font-size:11px;color:#c9d5e2;margin-top:4px}
.stripe{height:6px;background:linear-gradient(90deg,#f07a1a 0 70%,#0c1e33 70% 100%)}
.sb{padding:22px 26px 10px;display:flex;flex-direction:column;gap:18px;flex:1}
.st{font:700 12px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:#16304d;display:flex;align-items:center;gap:8px;margin:0 0 8px}
.st::before{content:"";width:10px;height:10px;background:#f07a1a;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.info{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.box{border:1px solid #d8dee5;border-radius:4px;padding:10px 12px;background:rgba(255,255,255,.85)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;align-items:baseline}
.kv .k{color:#5d6b7a;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv .v{font-weight:500;min-height:1.3em}
table.items{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.items th{background:#16304d;color:#fff;font:700 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;padding:8px;text-align:left}
.items .r{text-align:right}.items .c{text-align:center}
.items td{padding:7px 8px;border-bottom:1px solid #d8dee5;vertical-align:top}
.items tbody tr:nth-child(even) td{background:rgba(243,246,249,.75)}
.items td.no{color:#5d6b7a;width:28px;font-weight:600}
.items td.desc b{display:block;font-weight:700}
.items td.desc small{color:#5d6b7a;font-size:11px;display:block;margin-top:2px}
.items td.x{width:26px;padding:4px}
.del{border:0;background:transparent;color:#b0bac4;cursor:pointer;font-size:16px;line-height:1;padding:4px;border-radius:4px}
.del:hover{color:#c0392b;background:#fbeaea}
.addrow{margin-top:8px;display:flex;gap:6px}
.addrow button{border:1px dashed #b9c4cf;background:transparent;color:#16304d;font:600 12.5px var(--f-body);padding:7px 12px;border-radius:4px;cursor:pointer}
.addrow button:hover{border-color:#f07a1a;color:#c95a0c}
.sumrow{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
.totals{border:1px solid #d8dee5;border-radius:4px;overflow:hidden;font-variant-numeric:tabular-nums;background:#fff}
.totals div{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid #d8dee5}
.totals div span:first-child{color:#5d6b7a}
.totals .grand{background:#f07a1a;color:#fff;border:0;padding:11px 12px;align-items:baseline}
.totals .grand span:first-child{color:#fff;font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.totals .grand span:last-child{font:800 22px var(--f-display)}
.ext{font-size:11px;color:#5d6b7a;line-height:1.5;margin:6px 0 0}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.cond .k{color:#16304d;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.notes{line-height:1.6}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-top:26px}
.sign div{border-top:1px solid #18222e;padding-top:6px;text-align:center;font-size:11px;color:#5d6b7a}
.sign b{display:block;color:#18222e;font-size:12px}
.ft{background:#0c1e33;color:#c9d5e2;padding:12px 26px;display:flex;justify-content:space-between;gap:16px;font-size:10.5px;line-height:1.5;margin-top:14px;white-space:pre-line}
.ft .r{text-align:right}
.exporting .sheet [contenteditable]:empty::before{content:""}
.exporting .sheet .noexp{display:none!important}
.exporting .sheet [contenteditable]:hover{background:none}

@media (max-width:640px){.vhead h1{font-size:26px}.brandrow span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sync.busy i{background:#f07a1a}
.out{border:0;background:transparent;color:#9fb3c8;font:600 12.5px var(--f-body);cursor:pointer;padding:4px 6px;border-radius:5px}
.out:hover{color:#fff;background:rgba(255,255,255,.08)}
.lock{position:fixed;inset:0;z-index:50;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lockbox{background:var(--surface);border-radius:14px;padding:28px 24px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.lockbox img{width:120px;margin:0 auto}
.lockbox h2{margin:0;font:800 26px var(--f-display);text-transform:uppercase;color:var(--head)}
.lockbox p{margin:0;color:var(--mute)}
.lockbox input{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:12px;font-size:22px;text-align:center;letter-spacing:.3em}
.lockbox .btn{justify-content:center;padding:11px}
.lockbox .err{color:var(--bad);font-weight:600}
.rk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rk div{border:1px solid #d8dee5;border-radius:4px;padding:8px 10px;background:rgba(255,255,255,.9);display:flex;flex-direction:column;gap:1px}
.rk .k{color:#5d6b7a;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.rk b{font:800 19px var(--f-display);color:#16304d;font-variant-numeric:tabular-nums}
.rk small{color:#5d6b7a;font-size:10.5px}
.rt td{font-size:11.5px;padding:5px 8px}
.rt tfoot td{border-top:2px solid #16304d;font-size:11.5px;padding:6px 8px}
</style>
</head>

/* Modelo de custo único (planilha de controle + calculadora STLFLIX)
   lote: peso+purga (g), tempo (min), pós-processamento (min), unidades, embalagem/acessórios do lote (R$) */
function custo(x,P=S.P,markup){
  const un=Math.max(1,num(x.un)||1), h=num(x.tempo)/60;
  const material=(num(x.peso)+num(x.purga))/1000*P.filamento;
  const energia=h*P.potencia/1000*P.kwh;
  const deprec=h*(P.vida?P.maquina/P.vida:0);
  const mao=num(x.pos)/60*P.hora;
  const extras=num(x.extras); // por lote
  const base=material+energia+deprec+mao+extras;
  const loteRef=base/(1-Math.min(.95,P.falha));
  const refugo=loteRef-base;
  const fixoUn=P.pecasMes?P.fixos/P.pecasMes:0;
  const unit=loteRef/un+fixoUn;
  const mk=markup!=null?num(markup):P.markup, cg=carga();
  const preco=cg<1?unit*mk/(1-cg):0;
  const revenda=preco*(1-P.descRevenda);
  const liq=p=>p-unit-p*cg;
  return {un,material,energia,deprec,mao,extras,refugo,fixo:fixoUn*un,lote:loteRef+fixoUn*un,unit,preco,revenda,liq,mk,cg};
}
/* Produto: valores por peça */
const prodCost=p=>custo({peso:p.peso,tempo:p.tempo,pos:p.pos,extras:p.extras,un:1});
function prodStats(p){
  const c=prodCost(p), praticado=num(p.preco);
  const margem=praticado?praticado-c.unit-praticado*c.cg:null;
  const mh=margem!=null&&num(p.pos)>0?margem/(num(p.pos)/60):null;
  let un=0,rec=0,mar=0;
  S.vendas.filter(fechada).forEach(v=>(v.itens||[]).forEach(it=>{if(it.code&&it.code===p.code){un+=num(it.q);rec+=num(it.q)*num(it.vu);mar+=itemMargem(it)}}));
  let ver;
  if(p.status==='Morto')ver=['Arquivado',''];else if(!un)ver=['Sem venda ainda','info'];else if(mh!=null&&mh>=S.P.margemMin)ver=['Manter','good'];else ver=['Rever preço ou tempo','bad'];
  return {c,praticado,margem,mpct:praticado?margem/praticado:null,mh,un,rec,mar,ver};
}
const itemTotal=it=>num(it.q)*num(it.vu);
const itemMargem=it=>{const t=itemTotal(it);return t-num(it.q)*num(it.cu)-(it.passa?0:t*carga())};
function vendaCalc(v){let total=0,cust=0,tax=0;(v.itens||[]).forEach(it=>{const t=itemTotal(it);total+=t;cust+=num(it.q)*num(it.cu);if(!it.passa)tax+=t*carga()});
  const margem=total-cust-tax;return {total,cust,tax,margem,mh:num(v.horas)>0?margem/num(v.horas):null}}

async function pdfFrom(sh,z){
  if(!window.html2canvas||!window.jspdf)throw new Error('lib');
  const tf=sh.style.transform;document.body.classList.add('exporting');sh.style.transform='';if(z)z.style.height='';
  try{
    const canvas=await html2canvas(sh,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:1100,width:794});
    const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),pw=210,ph=297,pagePx=Math.floor(canvas.width*ph/pw);
    for(let y=0,pg=0;y<canvas.height-4;y+=pagePx,pg++){const h=Math.min(pagePx,canvas.height-y),c=document.createElement('canvas');c.width=canvas.width;c.height=h;
      const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,h);cx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(pg)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,h*pw/canvas.width)}
    return doc.output('blob');
  }finally{document.body.classList.remove('exporting');sh.style.transform=tf;fitAll()}
}
async function deliver(blob,name,share){
  if(share){const f=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
    toast('Este aparelho não envia arquivos direto. O arquivo foi baixado.')}
  saveFile(name,blob);if(!share)toast('Arquivo baixado: '+name)
}

  const hHum=(P.hHenrique+P.hRenato)*4.33, hUsadas=hrs/Math.max(1,meses), cap=hHum?hUsadas/hHum:0, hMaq=P.maquinas*P.horasDia*22, rph=hrs?mar/hrs:0;
  const anoRec=fe.filter(x=>String(x.v.data||'').startsWith(String(P.ano))).reduce((a,x)=>a+x.c.total,0);
  const pI=P.tetoInterno?anoRec/P.tetoInterno:0, pL=P.tetoLegal?anoRec/P.tetoLegal:0;
  const alerta=pI>.7?['Passou de 70% do teto interno','bad']:pL>.7?['Passou de 70% do teto legal','bad']:['Dentro dos limites','good'];
  const porTipo=t=>fe.filter(x=>(x.v.tipo||'Comércio')===t).reduce((a,x)=>a+x.c.total,0);
  const barC=p=>p>=1?'bad':p>=.7?'warn':'good';
  const k=(l,v,h,cls='',extra='')=>`<div class="kpi ${cls}"><span class="l">${l}</span><span class="v">${v}</span>${extra}${h?`<span class="h">${h}</span>`:''}</div>`;
  const canais=CANAIS.map(c=>{const all=S.vendas.filter(v=>v.canal===c),f=fe.filter(x=>x.v.canal===c);
    const r=f.reduce((a,x)=>a+x.c.total,0),m=f.reduce((a,x)=>a+x.c.margem,0),h=f.reduce((a,x)=>a+num(x.v.horas),0);
    return {c,n:all.length,f:f.length,r,m,h}}).filter(x=>x.n);
  const prods=S.produtos.slice().sort((a,b)=>String(a.code).localeCompare(b.code));

    ${k('Margem acumulada',brl(mar),'Só vendas entregues ou pagas.')}
    ${k('Falta recuperar',brl(falta),'Investido menos margem.')}
    ${k('% pago',pct(pago),'Quanto o negócio já devolveu.','hl',`<div class="bar good"><i style="width:${Math.min(100,pago*100)}%"></i></div>`)}
    ${k('Margem média por mês',brl(mMes),meses+' '+(meses===1?'mês':'meses')+' com venda.')}
    ${k('Meses até o payback',payback,'No ritmo atual. Sem venda, o relógio está parado.')}
  </div></div>
  <div class="sec"><h2>Resultado da operação</h2><div class="kpis">
    ${k('Receita total',brl(rec))}${k('Custo de produção',brl(cus))}${k('Margem total',brl(mar))}${k('Margem %',rec?pct(mar/rec):'—')}
    ${k('Horas gastas',nf(hrs)+' h','Lançadas nas vendas.')}${k('R$ por hora sua',hrs?brl(rph):'—','O número que decide se vale continuar.','hl')}
  </div></div>
  <div class="sec"><h2>Capacidade e tempo</h2><div class="kpis">
    ${k('Horas humanas / mês',nf(hHum)+' h','Henrique + Renato.')}
    ${k('Horas usadas / mês',nf(hUsadas)+' h')}
    ${k('% da capacidade',pct(cap),'Acima de 80% só cresce contratando ou automatizando.','',`<div class="bar ${cap>.8?'bad':'good'}"><i style="width:${Math.min(100,cap*100)}%"></i></div>`)}
    ${k('Horas de máquina / mês',nf(hMaq,0)+' h','Capacidade teórica das máquinas.')}
    ${k('Margem potencial / mês',hrs?brl(rph*hHum):'—','Usando todas as horas no ritmo atual.')}
  </div></div>
  <div class="sec"><h2>Limites fiscais do MEI · ${P.ano}</h2><div class="kpis">
    ${k('Receita no ano',brl(anoRec))}
    ${k('% do teto interno',pct(pI),'Teto de '+brl(P.tetoInterno)+'/ano.','',`<div class="bar ${barC(pI)}"><i style="width:${Math.min(100,pI*100)}%"></i></div>`)}
    ${k('% do teto legal',pct(pL),'Teto do MEI: '+brl(P.tetoLegal)+'.','',`<div class="bar ${barC(pL)}"><i style="width:${Math.min(100,pL*100)}%"></i></div>`)}
    ${k('Alerta',`<span class="chip ${alerta[1]}" style="font-size:14px">${alerta[0]}</span>`,'Avisa ao passar de 70%.')}
    ${k('Comércio',brl(porTipo('Comércio')),'Para a DASN e o relatório mensal.')}
    ${k('Serviço',brl(porTipo('Serviço')))}
  </div></div>
  <div class="sec"><h2>Margem por canal</h2>${canais.length?`<div class="tw"><table class="t"><thead><tr><th>Canal</th><th class="r">Orçamentos</th><th class="r">Fechados</th><th class="r">Conversão</th><th class="r">Receita</th><th class="r">Margem</th><th class="r">Horas</th><th class="r">Margem/hora</th></tr></thead><tbody>
    ${canais.map(x=>`<tr><td>${esc(x.c)}</td><td class="r">${x.n}</td><td class="r">${x.f}</td><td class="r">${pct(x.f/x.n)}</td><td class="r">${brl(x.r)}</td><td class="r">${brl(x.m)}</td><td class="r">${nf(x.h)}</td><td class="r"><b>${x.h?brl(x.m/x.h):'—'}</b></td></tr>`).join('')}
    </tbody></table></div><p class="h" style="color:var(--mute);font-size:13px;margin:8px 0 0">O melhor canal é o de maior margem por hora, não o de maior receita. Por isso preencha as horas em cada venda.</p>`:'<div class="tw"><p class="empty">Nenhuma venda lançada. Registre cada orçamento na aba <b>Vendas</b>, inclusive os perdidos, para ver a conversão por canal.</p></div>'}</div>
  <div class="sec"><h2>Desempenho por produto</h2>${prods.length?`<div class="tw"><table class="t"><thead><tr><th>Produto</th><th>Status</th><th class="r">Margem/hora</th><th class="r">Vendidas</th><th class="r">Receita</th><th class="r">Margem</th><th>Veredicto</th></tr></thead><tbody>
    ${prods.map(p=>{const s=prodStats(p);return `<tr><td><b>${esc(p.code)}</b> · ${esc(p.nome)}</td><td>${chipP(p.status)}</td><td class="r">${s.mh!=null?brl(s.mh):'—'}</td><td class="r">${nf(s.un,0)}</td><td class="r">${brl(s.rec)}</td><td class="r">${brl(s.mar)}</td><td><span class="chip ${s.ver[1]}">${s.ver[0]}</span></td></tr>`}).join('')}
    </tbody></table></div>`:'<div class="tw"><p class="empty">Cadastre produtos na aba <b>Produtos</b> ou pela <b>Calculadora</b>.</p></div>'}</div>`;
}

const CALC0={nome:'Exemplo · Chaveiro com logo (placa cheia)',h:3,m:0,peso:120,purga:20,un:30,pos:30,markup:'',pkg:[{d:'Argola de chaveiro',q:30,p:0.2}]};
let C=LS.get('o3d_calc2',null)||JSON.parse(JSON.stringify(CALC0));
function vCalc(){
  $('#main').innerHTML=offBanner()+head('Calculadora de custo','Informe o que o fatiador mostra para a placa inteira. O custo usa os Parâmetros do negócio; o resultado vira produto ou item de proposta.',
    `<button class="btn" id="cNew">Limpar</button><select id="cLoad" class="btn" aria-label="Abrir produto na calculadora"></select>`)+
  `<div class="calc">
   <div class="card">
    <fieldset><legend>Peça</legend><div class="grid">
      ${fld('c_nome','Nome da peça',C.nome,{full:true,ph:'Ex.: Chaveiro laço + logo'})}
      ${fld('c_h','Tempo de impressão',C.h,{dec:1,suf:'h'})}
      ${fld('c_m','e minutos',C.m,{dec:1,suf:'min'})}
      ${fld('c_peso','Peso total no fatiador',C.peso,{dec:1,suf:'g',hint:'Peso de todas as peças da placa.'})}
      ${fld('c_purga','Purga / torre / suportes',C.purga,{dec:1,suf:'g',hint:'Material que vai para o lixo.'})}
      ${fld('c_un','Peças na placa',C.un,{dec:1,suf:'un'})}
      ${fld('c_pos','Pós-processamento da placa',C.pos,{dec:1,suf:'min',hint:'Tirar suporte, lixar, montar, embalar.'})}
      ${fld('c_mk','Markup desta peça',C.markup,{dec:1,suf:'×',ph:String(S.P.markup).replace('.',','),hint:'Vazio = markup dos Parâmetros.'})}
    </div></fieldset>
    <fieldset><legend>Embalagem e acessórios do lote</legend>
      <div class="pkg" id="pkg"></div>
      <button class="btn sm" id="pkgAdd" style="margin-top:8px">+ Adicionar acessório</button>
    </fieldset>
    <details class="params"><summary>Parâmetros usados no cálculo</summary><div id="pUsed" class="lines"></div><p style="margin:10px 0 0"><a class="btn sm" href="#parametros">Editar parâmetros</a></p></details>
   </div>
   <div class="res" id="cRes"></div>
  </div>`;
  calcProdOpts();pkgRender();calcUpdate();
  $('#main .calc').addEventListener('input',e=>{if(e.target.closest('#pkg'))return;readCalc();calcUpdate()});
  $('#pkg').addEventListener('input',e=>{const r=e.target.closest('.row');if(!r)return;const i=+r.dataset.i;C.pkg[i][e.target.dataset.k]=e.target.dataset.k==='d'?e.target.value:num(e.target.value);calcUpdate()});
  $('#pkg').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){C.pkg.splice(+b.dataset.rm,1);pkgRender();calcUpdate()}});
  $('#pkgAdd').onclick=()=>{C.pkg.push({d:'',q:1,p:0});pkgRender();calcUpdate();$$('#pkg input[data-k="d"]').pop().focus()};
  $('#cNew').onclick=()=>{C={nome:'',h:0,m:0,peso:0,purga:0,un:1,pos:0,markup:'',pkg:[]};vCalc()};
  $('#cLoad').onchange=e=>{const p=S.produtos.find(x=>x.id===e.target.value);if(!p)return;
    C={nome:p.nome,h:Math.floor(num(p.tempo)/60),m:Math.round(num(p.tempo)%60*10)/10,peso:num(p.peso),purga:0,un:1,pos:num(p.pos),markup:'',pkg:num(p.extras)?[{d:'Insumos extras',q:1,p:num(p.extras)}]:[],prodId:p.id};vCalc();toast('Produto '+p.code+' aberto (valores por peça)')};
}
function calcProdOpts(){const s=$('#cLoad');if(!s)return;s.innerHTML='<option value="">Abrir produto…</option>'+S.produtos.slice().sort((a,b)=>String(a.code).localeCompare(b.code)).map(p=>`<option value="${p.id}">${esc(p.code+' · '+p.nome)}</option>`).join('')}
function pkgRender(){$('#pkg').innerHTML=C.pkg.length?`<div class="row" style="font-size:12px;color:var(--mute)"><span>Item</span><span>Qtd</span><span>R$ unit.</span><span></span></div>`+C.pkg.map((x,i)=>`<div class="row" data-i="${i}"><input data-k="d" value="${esc(x.d)}" placeholder="Ex.: argola, ímã, saquinho" aria-label="Item"><input data-k="q" inputmode="decimal" value="${esc(String(x.q).replace('.',','))}" aria-label="Quantidade"><input data-k="p" inputmode="decimal" value="${esc(n2(x.p))}" aria-label="Preço unitário"><button class="del" data-rm="${i}" aria-label="Remover">×</button></div>`).join(''):'<span style="color:var(--mute);font-size:13.5px">Nenhum acessório. Argolas, ímãs, chips NFC e saquinhos entram aqui.</span>'}
function readCalc(){C.nome=v_('c_nome');C.h=num(v_('c_h'));C.m=num(v_('c_m'));C.peso=num(v_('c_peso'));C.purga=num(v_('c_purga'));C.un=num(v_('c_un'))||1;C.pos=num(v_('c_pos'));C.markup=v_('c_mk')}
function calcX(){return {peso:C.peso,purga:C.purga,tempo:C.h*60+C.m,pos:C.pos,un:C.un,extras:C.pkg.reduce((a,x)=>a+num(x.q)*num(x.p),0)}}
function calcUpdate(){
  if(!$('#cRes'))return;LS.set('o3d_calc2',C);
  const mk=String(C.markup).trim()?num(C.markup):null;const r=custo(calcX(),S.P,mk),P=S.P;
  const L=(a,b,cls='')=>`<div class="${cls}"><span>${a}</span><span>${b}</span></div>`;
  $('#cRes').innerHTML=`<div class="price">
     <div class="kpi hl"><span class="l">Preço varejo / un</span><span class="v">${brl(r.preco)}</span><span class="h">Lucro líquido ${brl(r.liq(r.preco))} · ${r.preco?pct(r.liq(r.preco)/r.preco):'—'}</span></div>
     <div class="kpi"><span class="l">Preço revenda / un</span><span class="v">${brl(r.revenda)}</span><span class="h">Lucro líquido ${brl(r.liq(r.revenda))} · ${r.revenda?pct(r.liq(r.revenda)/r.revenda):'—'}</span></div>
   </div>
   <div class="card"><div class="lines">
     ${L('Material ('+nf(C.peso+C.purga)+' g)',brl(r.material))}${L('Energia',brl(r.energia))}${L('Depreciação da máquina',brl(r.deprec))}${L('Mão de obra',brl(r.mao))}
     ${L('Embalagem e acessórios',brl(r.extras))}${L('Refugo ('+pct(P.falha)+')',brl(r.refugo))}${L('Custo fixo rateado',brl(r.fixo))}
     ${L('Custo do lote ('+nf(r.un,0)+' un)',brl(r.lote),'tot')}${L('Custo por unidade',brl(r.unit),'tot')}
   </div></div>
   <div class="card"><div class="lines">
     ${L('Markup aplicado',nf(r.mk,2)+'×')}${L('Taxas sobre a venda',pct(r.cg))}${L('Lucro bruto / un (varejo)',brl(r.preco-r.unit))}${L('Faturamento do lote (varejo)',brl(r.preco*r.un))}${L('Lucro líquido do lote',brl(r.liq(r.preco)*r.un),'tot')}
   </div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="cToProp">Adicionar à proposta</button><button class="btn" id="cToProd">${C.prodId?'Atualizar produto':'Salvar como produto'}</button></div>`;
  $('#pUsed')&&($('#pUsed').innerHTML=[['Filamento',brl(P.filamento)+'/kg'],['Energia',brl(P.kwh)+'/kWh · '+nf(P.potencia,0)+' W'],['Depreciação',brl(P.vida?P.maquina/P.vida:0)+'/h'],['Hora de trabalho',brl(P.hora)+'/h'],['Falha',pct(P.falha)],['Custo fixo',brl(P.fixos)+'/mês ÷ '+nf(P.pecasMes,0)+' peças'],['Taxas (cartão + DAS + marketing)',pct(carga())],['Desconto revenda',pct(P.descRevenda)]].map(x=>L(x[0],x[1])).join(''));
  $('#cToProp').onclick=()=>{pendingItem={t:C.nome||'Peça impressa em 3D',d:'',q:nf(r.un,0),u:'un',vu:n2(r.preco),code:(S.produtos.find(p=>p.id===C.prodId)||{}).code||''};location.hash='#propostas'};
  $('#cToProd').onclick=()=>{const un=Math.max(1,C.un);const data={peso:+((C.peso+C.purga)/un).toFixed(2),tempo:+((C.h*60+C.m)/un).toFixed(2),pos:+(C.pos/un).toFixed(2),extras:+(calcX().extras/un).toFixed(2)};
    const ex=S.produtos.find(p=>p.id===C.prodId);
    prodForm(ex?{...ex,...data}:{code:'',nome:C.nome,status:'Ideia',preco:+r.preco.toFixed(2),...data})};
}

  $('#pNew').onclick=()=>prodForm({status:'Ideia'});

function prodForm(p){
  const bg=modal(p.id?'Produto '+(p.code||''):'Novo produto',`<div class="grid">
    ${fld('p_code','Código',p.code,{ph:'Ex.: CHV',hint:'Curto e único. Usado em vendas e testes.'})}
    ${fld('p_status','Status',p.status||'Ideia',{sel:STATUS_P})}
    ${fld('p_nome','Nome do produto',p.nome,{full:true})}
    ${fld('p_peso','Peso por peça',p.peso??'',{dec:1,suf:'g'})}
    ${fld('p_tempo','Impressão por peça',p.tempo??'',{dec:1,suf:'min'})}
    ${fld('p_pos','Pós-processamento por peça',p.pos??'',{dec:1,suf:'min'})}
    ${fld('p_extras','Insumos extras por peça',p.extras??'',{dec:1,suf:'R$',hint:'Argola, chip NFC, ímã, embalagem.'})}
    ${fld('p_preco','Preço praticado',p.preco??'',{dec:1,suf:'R$'})}
    ${fld('p_obs','Observação',p.obs||'',{full:true})}
  </div><div class="card" id="pPrev" style="margin-top:14px"></div>`,
  `${p.id?'<button class="btn danger" id="pDel">Excluir</button>':''}<span class="sp"></span><button class="btn" data-close>Cancelar</button><button class="btn pri" id="pSave">Salvar</button>`);
  const read=()=>({code:v_('p_code').trim().toUpperCase(),status:v_('p_status'),nome:v_('p_nome').trim(),peso:num(v_('p_peso')),tempo:num(v_('p_tempo')),pos:num(v_('p_pos')),extras:num(v_('p_extras')),preco:num(v_('p_preco')),obs:v_('p_obs')});
  const prev=()=>{const d=read(),c=prodCost(d),m=d.preco?d.preco-c.unit-d.preco*c.cg:null;$('#pPrev').innerHTML=`<div class="lines"><div><span>Custo com refugo</span><span>${brl(c.unit)}</span></div><div><span>Preço sugerido</span><span>${brl(c.preco)}</span></div><div><span>Margem no preço praticado</span><span>${m!=null?brl(m)+' · '+pct(m/d.preco):'—'}</span></div><div><span>Margem por hora sua</span><span>${m!=null&&d.pos?brl(m/(d.pos/60)):'—'}</span></div></div>`};
  bg.addEventListener('input',prev);prev();
  $('#pSave').onclick=async()=>{const d=read();if(!d.code||!d.nome){toast('Preencha código e nome.');return}
    if(S.produtos.some(x=>x.code===d.code&&x.id!==p.id)){toast('Já existe um produto com o código '+d.code+'.');return}
    const id=p.id||newId('p');if(await put('produtos',id,{...d,ts:Date.now()})){closeModal();toast('Produto '+d.code+' salvo');if(view()==='calculadora'){C.prodId=id;calcUpdate()}}};
  if(p.id)confirmBtn($('#pDel'),async()=>{await del('produtos',p.id);closeModal();toast('Produto excluído')});
}

let vFilter='Todas';
function vVendas(){
  const vs=S.vendas.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))||(b.ts||0)-(a.ts||0));
  const list=vFilter==='Todas'?vs:vs.filter(v=>v.status===vFilter);

  const prods=Object.entries(pm).sort((a,b)=>b[1].r-a[1].r);
  sh.innerHTML=repHeader('Relatório gerencial',perLabel(repPer).replace(/^./,c=>c.toUpperCase()))+`<div class="sb">
    <div><h3 class="st">Resultado do período</h3><div class="rk">
      ${rk('Receita',brl(rec),fe.length+' vendas fechadas')}${rk('Custo de produção',brl(cus))}${rk('Taxas',brl(tax))}
      ${rk('Margem',brl(mar),rec?pct(mar/rec)+' da receita':'')}${rk('Horas gastas',nf(hrs)+' h')}${rk('R$ por hora',hrs?brl(mar/hrs):'—')}
      ${rk('Orçamentos',String(vs.length),vs.length?pct(fe.length/vs.length)+' de conversão':'')}${rk('Ticket médio',fe.length?brl(rec/fe.length):'—')}${rk('Em aberto',brl(abertos.reduce((a,v)=>a+vendaCalc(v).total,0)),abertos.length+' orçamentos')}
    </div></div>
    <div><h3 class="st">Payback (acumulado desde o início)</h3><div class="rk">${rk('Total investido',brl(inv))}${rk('Margem acumulada',brl(marTot))}${rk('% pago',pct(inv?marTot/inv:0),'Falta '+brl(Math.max(0,inv-marTot)))}</div></div>
    <div><h3 class="st">Vendas fechadas</h3>${fe.length?`<table class="items rt"><thead><tr><th>Data</th><th>Cliente</th><th>Canal</th><th>Itens</th><th class="r">Total</th><th class="r">Margem</th></tr></thead><tbody>
      ${fe.map(x=>`<tr><td>${fmtDate(x.v.data)}</td><td>${esc(x.v.cliente)}</td><td>${esc(x.v.canal)}</td><td>${esc((x.v.itens||[]).map(i=>nf(num(i.q),0)+'× '+(i.code||i.d||'Avulso')).join(', '))}</td><td class="r">${n2(x.c.total)}</td><td class="r">${n2(x.c.margem)}</td></tr>`).join('')}
      </tbody></table>`:'<p class="ext">Nenhuma venda entregue ou paga neste período.</p>'}</div>
    ${canais.length?`<div><h3 class="st">Por canal</h3><table class="items rt"><thead><tr><th>Canal</th><th class="r">Orçamentos</th><th class="r">Fechados</th><th class="r">Receita</th><th class="r">Margem</th><th class="r">Margem/hora</th></tr></thead><tbody>
      ${canais.map(x=>`<tr><td>${esc(x.c)}</td><td class="r">${x.n}</td><td class="r">${x.f}</td><td class="r">${n2(x.r)}</td><td class="r">${n2(x.m)}</td><td class="r">${x.h?n2(x.m/x.h):'—'}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${prods.length?`<div><h3 class="st">Por produto</h3><table class="items rt"><thead><tr><th>Produto</th><th class="r">Unidades</th><th class="r">Receita</th><th class="r">Margem</th></tr></thead><tbody>
      ${prods.map(([k,x])=>{const p=S.produtos.find(q=>q.code===k);return `<tr><td>${esc(p?k+' · '+p.nome:k)}</td><td class="r">${nf(x.u,0)}</td><td class="r">${n2(x.r)}</td><td class="r">${n2(x.m)}</td></tr>`}).join('')}</tbody></table></div>`:''}
    ${abertos.length?`<div><h3 class="st">Orçamentos em aberto</h3><table class="items rt"><thead><tr><th>Data</th><th>Cliente</th><th>Status</th><th class="r">Valor</th></tr></thead><tbody>
      ${abertos.map(v=>`<tr><td>${fmtDate(v.data)}</td><td>${esc(v.cliente)}</td><td>${esc(v.status)}</td><td class="r">${n2(vendaCalc(v).total)}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${perd.length?`<p class="ext">${perd.length} ${perd.length===1?'orçamento perdido':'orçamentos perdidos'} no período, somando ${brl(perd.reduce((a,v)=>a+vendaCalc(v).total,0))}.</p>`:''}
    <p class="ext">Receita, custo e margem consideram vendas Entregues ou Pagas. Valores das tabelas em R$.</p>
  </div><footer class="ft"><div>${esc(E.rodapeE)}</div><div class="r">Gerado pela Central 3D Ostras</div></footer>`;
  fitAll();
}
const rk=(l,v,h='')=>`<div><span class="k">${esc(l)}</span><b>${v}</b>${h?`<small>${esc(h)}</small>`:''}</div>`;

function extenso(v){
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const tri=n=>{if(n===100)return'cem';const a=Math.floor(n/100),r=n%100,p=[];if(a)p.push(c[a]);if(r<20){if(r)p.push(u[r])}else{p.push(d[Math.floor(r/10)]+(r%10?' e '+u[r%10]:''))}return p.join(' e ')};
  const reais=Math.floor(v),cent=Math.round((v-reais)*100);let out=[];
  const mi=Math.floor(reais/1e6),mil=Math.floor(reais%1e6/1000),r=reais%1000;
  if(mi)out.push(tri(mi)+(mi>1?' milhões':' milhão'));if(mil)out.push(mil===1?'mil':tri(mil)+' mil');if(r)out.push(tri(r));
  let s=out.join(out.length>1&&r&&(r<100||r%100===0)?' e ':' ');
  if(reais)s+=(mi&&!mil&&!r?' de':'')+(reais===1?' real':' reais');
  if(cent)s+=(reais?' e ':'')+tri(cent)+(cent===1?' centavo':' centavos');
  return s?s.charAt(0).toUpperCase()+s.slice(1):'Zero real';
}
