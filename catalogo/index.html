<style>
/* Página pública do link da bio: hub de botões, filtros por categoria, grade de modelos e ficha com pedido pelo WhatsApp. Um só visual escuro da marca. */
:root{
  color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#172A3D;--azul:#243A4E;--azul2:#2C4660;--azul3:#35536F;
  --laranja:#E07819;--laranja2:#F08A2C;--prata:#D7D9DA;--ink:#EEF0F1;--muted:#A3B3C2;--line:rgba(215,217,218,.14);
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--c:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--navy);color:var(--ink);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
img{max-width:100%}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.cut{clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hub{padding-block:34px 8px}
.hubin{max-width:560px;margin:0 auto;display:grid;justify-items:center;text-align:center}
.hub img.logo{width:132px;height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.4));margin-bottom:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--laranja)}
.hub h1{font-size:clamp(28px,7.6vw,42px);line-height:1.06;font-weight:800;letter-spacing:-.02em;margin:10px 0;text-wrap:balance}
.hub p{color:var(--muted);margin:0 0 20px;max-width:46ch}
.links{display:grid;gap:12px;width:100%}
.lk{--c:12px;display:grid;grid-template-columns:46px 1fr 18px;align-items:center;gap:14px;padding:13px 16px;background:var(--azul);text-decoration:none;text-align:left;color:var(--ink);transition:background .15s,transform .15s}
.lk:hover{background:var(--azul2);transform:translateY(-1px)}
.lk.primary{background:var(--laranja);color:#1a1206}
.lk.primary:hover{background:var(--laranja2)}
.lk .ic{width:46px;height:46px;display:grid;place-items:center;background:rgba(215,217,218,.08);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.lk.primary .ic{background:rgba(26,18,6,.14)}
.lk .ic svg{width:22px;height:22px}
.lk b{display:block;font-size:16px;font-weight:700;line-height:1.3}
.lk small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.lk.primary small{color:rgba(26,18,6,.75)}
.lk .arr{width:18px;height:18px;opacity:.7}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:20px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.facts span::before{content:"";display:inline-block;width:6px;height:6px;background:var(--laranja);margin-right:8px;transform:rotate(45deg) translateY(-2px)}
.sechead{padding-block:36px 4px}
.sechead h2{margin:6px 0 0;font-size:clamp(24px,5vw,34px);font-weight:800;letter-spacing:-.01em}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--navy) 82%,rgba(23,42,61,0));padding-block:14px 16px}
.filters .wrap{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{--c:6px;flex:none;border:0;cursor:pointer;background:var(--azul);color:var(--prata);padding:10px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--laranja);color:#1a1206}
.chip .n{font-family:var(--mono);font-weight:400;opacity:.75;margin-left:6px;font-size:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--azul);padding:0 12px;border-radius:2px;max-width:420px}
.search input{flex:1;background:transparent;border:0;padding:11px 0;outline:none;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr));padding-block:6px 40px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;background:none;border:0;padding:0;min-width:0}
.media{--c:14px;position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--azul)}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .media img{transform:scale(1.03)}
.ph{width:100%;height:100%;display:grid;place-items:center;background:repeating-linear-gradient(0deg,rgba(215,217,218,.045) 0 1px,transparent 1px 9px),linear-gradient(150deg,#2E4B67 0%,#223A51 55%,#1B2F43 100%)}
.ph svg{width:62%;height:auto}
.badge{--c:5px;position:absolute;top:10px;left:10px;background:var(--laranja);color:#1a1206;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 9px}
.card .cat{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card h3{margin:0;font-size:16px;line-height:1.25;font-weight:700;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .price{font-family:var(--mono);font-size:12px;color:var(--prata)}
.empty{grid-column:1/-1;padding:40px 0;color:var(--muted);text-align:center}
.skel{aspect-ratio:4/5;background:var(--azul);opacity:.6}
footer{border-top:1px solid var(--line);padding-block:32px 48px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
footer img{height:60px;width:auto}
footer p{margin:0;color:var(--muted);font-size:14px}
footer strong{color:var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,16,24,.74);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:820px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--navy);width:100%;max-width:980px;max-height:94vh;overflow:auto;border-top:3px solid var(--laranja);position:relative;padding-bottom:env(safe-area-inset-bottom,0px)}
.close{position:sticky;top:0;float:right;margin:10px 10px 0 0;z-index:3;width:44px;height:44px;border:0;border-radius:50%;background:var(--azul2);display:grid;place-items:center;cursor:pointer}
.close svg{width:18px;height:18px}
.detail{display:grid;gap:22px;padding:18px 16px 24px}
@media(min-width:820px){.detail{grid-template-columns:1fr 1fr;padding:28px}}
.gal .main{--c:14px;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--azul)}
.gal .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{flex:none;width:58px;height:72px;padding:0;border:2px solid transparent;background:var(--azul);cursor:pointer;overflow:hidden}
.thumbs button[aria-current="true"]{border-color:var(--laranja)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info h2{font-size:clamp(24px,4.4vw,34px);line-height:1.1;margin:8px 0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.info .lead{color:var(--laranja2);font-weight:600;margin:0 0 12px}
.info p{margin:0 0 14px;color:var(--prata)}
.info h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:500}
.ben{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ben li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
.ben li::before{content:"";width:10px;height:10px;margin-top:7px;background:var(--laranja);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{--c:5px;background:var(--azul);padding:6px 10px;font-size:13px;color:var(--prata)}
.specs{font-family:var(--mono);font-size:13px;border-top:1px solid var(--line);margin:0}
.specs div{padding:9px 0;border-bottom:1px solid var(--line)}
.pricebox{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:16px}
.pricebox b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.buybar{position:sticky;bottom:0;background:linear-gradient(rgba(23,42,61,0),var(--navy) 30%);padding:18px 0 4px;display:flex;flex-wrap:wrap;gap:10px}
.btn{--c:7px;flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;padding:13px 18px;font-weight:700;font-size:15px;text-decoration:none;background:var(--azul2);color:var(--ink)}
.btn.primary{background:var(--laranja);color:#1a1206}
.btn.primary:hover{background:var(--laranja2)}
.btn svg{width:18px;height:18px}
.notice{max-width:560px;margin:16px auto 0;padding:12px 14px;background:rgba(224,120,25,.14);border:1px solid rgba(224,120,25,.5);font-size:14px;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" aria-hidden="true">'+b+'</svg>';
}

const foto=(id,w)=>'https://lh3.googleusercontent.com/d/'+id+'=w'+(w||1000);
const img=(id,alt,w)=>'<img src="'+foto(id,w)+'" alt="'+esc(alt)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=\'https://drive.google.com/thumbnail?id='+esc(id)+'&sz=w'+(w||1000)+'\'">';
let D=null,cat='todos',q='';
function waLink(msg){const n=String((D&&D.settings.whatsapp)||'').replace(/\D/g,'');return 'https://wa.me/'+(n.length<=11?'55':'')+n+'?text='+encodeURIComponent(msg||'')}
function render(){
  const S=D.settings||{},cats=S.categorias||[],itens=(D.itens||[]).slice().sort((a,b)=>(+a.ordem||0)-(+b.ordem||0));
  document.title=(S.marca||'3D Ostras')+' · Catálogo';
  $('#hTitle').textContent=S.slogan||'Onde ideias ganham forma.';
  $('#hIntro').textContent=S.intro||'';$('#hIntro').hidden=!S.intro;
  $('#fMarca').textContent=S.marca||'3D Ostras';$('#fCidade').textContent=S.cidade||'';
  $('#links').innerHTML=(S.links||[]).map(l=>{
    const t=l.tipo||'link';let href='#catalogo',ic=I.grid,ext=false;
    if(t==='whatsapp'){href=waLink(l.valor);ic=I.wa;ext=true}
    else if(t==='instagram'){href='https://instagram.com/'+encodeURIComponent(S.instagram||'');ic=I.ig;ext=true}
    else if(t==='link'){href=/^https?:\/\//.test(l.valor||'')?l.valor:'#';ic=I.link;ext=true}
    return '<a class="lk cut'+(l.destaque?' primary':'')+'" href="'+esc(href)+'"'+(ext?' target="_blank" rel="noopener"':'')+'><span class="ic">'+ic+'</span><span><b>'+esc(l.rotulo)+'</b>'+(l.sub?'<small>'+esc(l.sub)+'</small>':'')+'</span>'+I.arr+'</a>'}).join('');
  $('#facts').innerHTML=[S.cidade,S.instagram?'@'+S.instagram:'',S.whatsapp?'WhatsApp '+fmtTel(S.whatsapp):''].filter(Boolean).map(f=>'<span>'+esc(f)+'</span>').join('');
  const usadas=cats.filter(c=>itens.some(p=>p.categoria===c.id));
  $('#chips').innerHTML=[{id:'todos',nome:'Todos'},...usadas].map(c=>'<button class="chip cut" data-c="'+esc(c.id)+'" aria-pressed="'+(c.id===cat)+'">'+esc(c.nome)+'<span class="n">'+(c.id==='todos'?itens.length:itens.filter(p=>p.categoria===c.id).length)+'</span></button>').join('');
  const qq=q.trim().toLowerCase();
  const list=itens.filter(p=>(cat==='todos'||p.categoria===cat)&&(!qq||[p.nome,p.subtitulo,p.descricao,(p.personalizacao||[]).join(' ')].join(' ').toLowerCase().includes(qq)));
  $('#grid').innerHTML=list.length?list.map(p=>{const c=cats.find(x=>x.id===p.categoria);return '<button class="card" data-id="'+esc(p.id)+'"><div class="media cut">'+(p.fotos&&p.fotos.length?img(p.fotos[0],p.nome,700):'<div class="ph">'+artSvg(p.icone)+'</div>')+(p.selo?'<span class="badge">'+esc(p.selo)+'</span>':'')+'</div><span class="cat">'+esc(c?c.nome:'')+'</span><h3>'+esc(p.nome)+'</h3>'+(p.subtitulo?'<p>'+esc(p.subtitulo)+'</p>':'')+(p.preco?'<span class="price">'+esc(p.preco)+'</span>':'')+'</button>'}).join(''):'<p class="empty">Nenhum modelo encontrado. Fale com a gente no WhatsApp: fazemos sob medida.</p>';
}
function fmtTel(n){n=String(n).replace(/\D/g,'');return n.length===11?'('+n.slice(0,2)+') '+n.slice(2,7)+'-'+n.slice(7):n}
function open(id){
  const p=(D.itens||[]).find(x=>x.id===id);if(!p)return;const S=D.settings||{},c=(S.categorias||[]).find(x=>x.id===p.categoria);
  const fotos=p.fotos||[];let cur=0;
  const L=(t,a)=>a&&a.length?'<h4>'+t+'</h4>':'';
  $('#ov').innerHTML='<div class="overlay" id="ovbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(p.nome)+'"><button class="close" id="cls" aria-label="Fechar">'+I.x+'</button><div class="detail">'+
   '<div class="gal"><div class="main cut" id="gm">'+(fotos.length?img(fotos[0],p.nome,1400):'<div class="ph">'+artSvg(p.icone)+'</div>')+'</div>'+(fotos.length>1?'<div class="thumbs">'+fotos.map((f,i)=>'<button data-i="'+i+'" aria-current="'+(i===0)+'" aria-label="Foto '+(i+1)+'">'+img(f,'',200)+'</button>').join('')+'</div>':'')+'</div>'+
   '<div class="info"><span class="eyebrow">'+esc(c?c.nome:'')+'</span><h2>'+esc(p.nome)+'</h2>'+(p.chamada?'<p class="lead">'+esc(p.chamada)+'</p>':'')+(p.descricao?'<p>'+esc(p.descricao)+'</p>':'')+
   L('O que você recebe',p.beneficios)+(p.beneficios&&p.beneficios.length?'<ul class="ben">'+p.beneficios.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>':'')+
   L('Dá para personalizar',p.personalizacao)+(p.personalizacao&&p.personalizacao.length?'<div class="tags">'+p.personalizacao.map(b=>'<span class="cut">'+esc(b)+'</span>').join('')+'</div>':'')+
   L('Especificações',p.specs)+(p.specs&&p.specs.length?'<div class="specs">'+p.specs.map(b=>'<div>'+esc(b)+'</div>').join('')+'</div>':'')+
   '<div class="pricebox">'+(p.prazo?'<span>Prazo<b>'+esc(p.prazo)+'</b></span>':'')+(p.preco?'<span>Preço<b>'+esc(p.preco)+'</b></span>':'')+'</div>'+
   '<div class="buybar"><a class="btn primary cut" target="_blank" rel="noopener" href="'+esc(waLink('Olá! Vi o modelo "'+p.nome+'" no catálogo da '+(S.marca||'3D Ostras')+' e quero um orçamento.'))+'">'+I.wa+'Pedir orçamento deste modelo</a></div></div></div></div></div>';
  document.body.style.overflow='hidden';
  const close=()=>{$('#ov').innerHTML='';document.body.style.overflow='';if(location.hash)history.replaceState(null,'',location.pathname+location.search)};
  $('#cls').onclick=close;$('#ovbg').onclick=e=>{if(e.target.id==='ovbg')close()};
  document.onkeydown=e=>{if(e.key==='Escape'&&$('#ovbg'))close()};
  const th=document.querySelector('.thumbs');if(th)th.onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.i;$('#gm').innerHTML=img(fotos[cur],p.nome,1400);th.querySelectorAll('button').forEach((x,i)=>x.setAttribute('aria-current',i===cur))};
  if(location.hash!=='#'+p.id)history.replaceState(null,'',location.pathname+location.search+'#'+p.id);
  $('#cls').focus();
}
$('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;render()};
$('#q').oninput=e=>{q=e.target.value;render()};
$('#grid').onclick=e=>{const b=e.target.closest('.card');if(b)open(b.dataset.id)};
function show(d,fromNet){const first=!D;D=d;render();if(first&&location.hash.length>1)open(decodeURIComponent(location.hash.slice(1)))}
try{const c=localStorage.getItem('o3d_vit');if(c)show(JSON.parse(c))}catch(_){}
fetch(API_URL,{method:'POST',body:JSON.stringify({action:'vitrine'})}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);try{localStorage.setItem('o3d_vit',JSON.stringify(j.data))}catch(_){}show(j.data,true)})
 .catch(()=>{if(!D){$('#grid').innerHTML='<p class="empty">Não foi possível carregar o catálogo agora. Tente de novo em instantes.</p>';const n=$('#notice');n.hidden=false;n.textContent='Catálogo temporariamente indisponível. Recarregue a página.'}});
})();
</script>
</body></html>
